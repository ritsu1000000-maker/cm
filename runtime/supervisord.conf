[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/workspace/.botbox/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
user=sandbox

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:web-terminal]
command=/opt/botbox/run-ttyd.sh
autostart=true
autorestart=true
startsecs=2
startretries=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/.botbox/logs/web-terminal.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/workspace/.botbox/logs/web-terminal-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2

[program:discord-bot]
command=/opt/botbox/run-bot.sh
autostart=true
autorestart=true
startsecs=3
startretries=999
stopsignal=TERM
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/.botbox/logs/bot.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=4
stderr_logfile=/workspace/.botbox/logs/bot-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=4


[program:upload-server]
command=/usr/bin/python3 /opt/botbox/upload_server.py
autostart=true
autorestart=true
startsecs=2
startretries=20
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/.botbox/logs/upload-server.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
stderr_logfile=/workspace/.botbox/logs/upload-server-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=2
